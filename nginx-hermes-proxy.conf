# Add this block inside your existing server { } block in Nginx config
# Typically at: /etc/nginx/sites-available/leadcom.chat

# Hermes Agent reverse proxy — keeps API key server-side
location /api/chat/ {
    # Forward to local Hermes Agent
    proxy_pass http://127.0.0.1:8642/v1/chat/;

    # Inject the API key server-side (never exposed to browsers)
    proxy_set_header Authorization "Bearer 691b5dc834e04f39807e49f4bcb1715c98d610bed4e009566f4b0c875d3482c9";

    # Required for SSE streaming (chat responses stream in real-time)
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout for long-running AI responses
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
